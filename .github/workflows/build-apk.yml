name: Build ONNXCloudGaming Native (XStreaming)

on:
  workflow_dispatch:
  push:
    branches: [ phase-9-native-webrtc-experiment ]

permissions:
  contents: read

jobs:
  build-native:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ONNXCloudGaming and XStreaming source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Android SDK components
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK and CMake
        run: sdkmanager "ndk;23.1.7779620" "cmake;3.22.1"

      - name: Set up Rust for native engine
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi,aarch64-linux-android

      - name: Repair malformed upstream React Native Paper patch
        working-directory: vendor/XStreaming
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("patches/react-native-paper+5.12.5.patch")
          s = p.read_text()
          old = "@@ -270,7 +262,7 @@"
          new = "@@ -270,6 +262,6 @@"
          if old not in s:
              raise SystemExit("Expected malformed React Native Paper patch hunk was not found.")
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Install JavaScript dependencies
        working-directory: vendor/XStreaming
        run: |
          corepack enable
          corepack prepare yarn@4.2.2 --activate
          yarn install --no-immutable

      - name: Patch upstream NDK host detection for Linux CI
        working-directory: vendor/XStreaming/android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("app/build.gradle")
          s = p.read_text()
          pattern = r'def nanoRustHostTag = \{ ndkDir ->.*?\n\}'
          replacement = '''def nanoRustHostTag = { ndkDir ->
              def os = System.getProperty("os.name").toLowerCase()
              if (os.contains("mac")) {
                  def armTag = file("${ndkDir}/toolchains/llvm/prebuilt/darwin-arm64")
                  return armTag.exists() ? "darwin-arm64" : "darwin-x86_64"
              }
              return "linux-x86_64"
          }'''
          updated, count = re.subn(pattern, lambda _: replacement, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit("Could not locate nanoRustHostTag closure; refusing to build with an unpatched Linux host tag.")
          p.write_text(updated)
          PY

      - name: Build native Android TV APK
        working-directory: vendor/XStreaming/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDevDebug

      - name: Upload native APK
        uses: actions/upload-artifact@v4
        with:
          name: onnxcloudgaming-native-phase-9-1
          path: vendor/XStreaming/android/app/build/outputs/apk/dev/debug/app-dev-debug.apk
          if-no-files-found: error
          retention-days: 14
