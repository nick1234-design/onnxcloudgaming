name: Build ONNXCloudGaming Phase 4 Settings Integration

on:
  workflow_dispatch:
  push:
    branches: [ phase-4-settings-integration ]

permissions:
  contents: read

jobs:
  build-native:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ONNXCloudGaming and XStreaming source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Android SDK components
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK and CMake
        run: sdkmanager "ndk;23.1.7779620" "cmake;3.22.1"

      - name: Set up Rust for native engine
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi,aarch64-linux-android

      - name: Repair malformed upstream React Native Paper patch
        working-directory: vendor/XStreaming
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("patches/react-native-paper+5.12.5.patch")
          s = p.read_text()
          old = "@@ -270,7 +262,7 @@"
          new = "@@ -270,6 +262,6 @@"
          if old not in s:
              raise SystemExit("Expected malformed React Native Paper patch hunk was not found.")
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Install JavaScript dependencies
        working-directory: vendor/XStreaming
        run: |
          corepack enable
          corepack prepare yarn@4.2.2 --activate
          yarn install --no-immutable

      - name: Patch upstream NDK host detection for Linux CI
        working-directory: vendor/XStreaming/android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("app/build.gradle")
          s = p.read_text()
          pattern = r'def nanoRustHostTag = \{ ndkDir ->.*?\n\}'
          replacement = '''def nanoRustHostTag = { ndkDir ->
              def os = System.getProperty("os.name").toLowerCase()
              if (os.contains("mac")) {
                  def armTag = file("${ndkDir}/toolchains/llvm/prebuilt/darwin-arm64")
                  return armTag.exists() ? "darwin-arm64" : "darwin-x86_64"
              }
              return "linux-x86_64"
          }'''
          updated, count = re.subn(pattern, lambda _: replacement, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit("Could not locate nanoRustHostTag closure; refusing to build with an unpatched Linux host tag.")
          p.write_text(updated)
          PY

      - name: Use CI debug key for sideloadable test release
        working-directory: vendor/XStreaming/android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle")
          s = p.read_text()
          old = "            signingConfig signingConfigs.release"
          new = "            signingConfig signingConfigs.debug"
          if s.count(old) != 1:
              raise SystemExit("Expected single release signing assignment was not found.")
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Apply ONNXCloudGaming app identity to the native XStreaming build
        working-directory: vendor/XStreaming
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path("android/app/build.gradle")
          source = gradle.read_text()
          pattern = r'(prod\s*\{\s*dimension "environment"\s*applicationId )"com\.xstreaming"'
          updated, count = re.subn(pattern, r'\1"com.nick1234.onnxcloudgaming"', source, count=1)
          if count != 1:
              raise SystemExit("Could not safely locate the prod applicationId; refusing to alter the package identity.")
          gradle.write_text(updated)

          strings = Path("android/app/src/main/res/values/strings.xml")
          xml = strings.read_text()
          if '<string name="app_name">XStreaming</string>' not in xml:
              raise SystemExit("Expected upstream app_name string was not found.")
          strings.write_text(xml.replace(
              '<string name="app_name">XStreaming</string>',
              '<string name="app_name">ONNXCloudGaming</string>',
              1
          ))
          PY

      - name: Apply ONNXCloudGaming branding assets
        run: |
          set -euo pipefail
          ZIP="branding/onnxcloudgaming-build68-branding-assets.zip"
          test -s "$ZIP"
          mkdir -p /tmp/onnxcloudgaming-branding
          unzip -o "$ZIP" -d /tmp/onnxcloudgaming-branding
          SRC="/tmp/onnxcloudgaming-branding/app/src/main/res"
          DEST="vendor/XStreaming/android/app/src/main/res"
          test -s "$SRC/drawable-nodpi/onn_splash.png"
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            test -s "$SRC/mipmap-$density/ic_launcher.png"
            mkdir -p "$DEST/mipmap-$density"
            cp "$SRC/mipmap-$density/ic_launcher.png" "$DEST/mipmap-$density/ic_launcher.png"
          done
          mkdir -p "$DEST/drawable-nodpi"
          cp "$SRC/drawable-nodpi/onn_splash.png" "$DEST/drawable-nodpi/screen.png"
          echo "Applied ONNXCloudGaming launcher icons and splash screen."

      - name: Apply ONNXCloudGaming Phase 4 integrated settings
        run: |
          test -s phase-4/Settings.tsx
          cp phase-4/Settings.tsx vendor/XStreaming/src/pages/Settings.tsx
          grep -q "ONNXCloudGaming" vendor/XStreaming/src/pages/Settings.tsx

      - name: Restore official Google and Maven Central repositories
        working-directory: vendor/XStreaming/android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build.gradle")
          s = p.read_text()
          old = "\n".join([
              "    repositories {",
              "//        google()",
              "//        mavenCentral()",
              "        maven { url 'https://maven.aliyun.com/repository/google' }",
              "        maven { url 'https://maven.aliyun.com/repository/public' }",
              "        maven { url 'https://repo1.maven.org/maven2/' }",
              "    }",
          ])
          new = "\n".join([
              "    repositories {",
              "        google()",
              "        maven { url 'https://maven.aliyun.com/repository/google' }",
              "        maven { url 'https://maven.aliyun.com/repository/public' }",
              "        mavenCentral()",
              "    }",
          ])
          if old not in s:
              raise SystemExit("Expected upstream repository block not found; refusing to patch blindly.")
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Build bundled native Android TV release APK
        working-directory: vendor/XStreaming/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleProdRelease

      - name: Upload native APK
        uses: actions/upload-artifact@v4
        with:
          name: onnxcloudgaming-phase-4-settings
          path: vendor/XStreaming/android/app/build/outputs/apk/prod/release/app-prod-release.apk
          if-no-files-found: error
          retention-days: 14
